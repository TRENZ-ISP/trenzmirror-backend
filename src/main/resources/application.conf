ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.trenz.mirror.ApplicationKt.module ]
    }
}
jwt {
    secret = "your-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "trenz-mirror"
    audience = "trenz-mirror-android"
    realm = "TrenzMirror"
}
database {
    path = "jdbc:sqlite:trenz_mirror.db"
    path = ${?DB_PATH}
}
